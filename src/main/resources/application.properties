spring.application.name=kyc-portal
server.port=8085

# In-memory H2 for local development and CI. Override with environment variables
# (for example SPRING_DATASOURCE_URL) when a real database is used later.
spring.datasource.url=jdbc:h2:mem:kycdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

# Uploads (used from Task 5 onwards)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
kyc.upload-dir=uploads

# Demo accounts only. Never reuse this password anywhere real.
kyc.seed.password=ChangeMe@123

# Only the health endpoint is exposed
management.endpoints.web.exposure.include=health,info
