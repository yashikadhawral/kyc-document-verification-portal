---
- name: Read the currently deployed version
  ansible.builtin.slurp:
    src: "{{ app_dir }}/current_version"
  register: cur
  failed_when: false

- name: Remember the previous stable version
  ansible.builtin.set_fact:
    previous_tag: "{{ (cur.content | b64decode | trim) if cur.content is defined else '' }}"

- name: Deploy new version with automatic rollback
  block:
    - name: Pull the image
      community.docker.docker_image:
        name: "{{ image_repo }}"
        tag: "{{ image_tag }}"
        source: pull

    - name: Run the container
      community.docker.docker_container:
        name: "{{ app_name }}-ansible"
        image: "{{ image_repo }}:{{ image_tag }}"
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "{{ host_port }}:{{ container_port }}"

    - name: Health check
      ansible.builtin.uri:
        url: "http://localhost:{{ host_port }}{{ health_path }}"
        status_code: 200
      register: health
      retries: 6
      delay: 5
      until: health.status == 200

    - name: Record previous stable version
      ansible.builtin.copy:
        content: "{{ previous_tag }}\n"
        dest: "{{ app_dir }}/previous_version"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0644"
      when: previous_tag | length > 0 and previous_tag != image_tag

    - name: Record current version
      ansible.builtin.copy:
        content: "{{ image_tag }}\n"
        dest: "{{ app_dir }}/current_version"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0644"

  rescue:
    - name: Roll back to the previous stable version
      community.docker.docker_container:
        name: "{{ app_name }}-ansible"
        image: "{{ image_repo }}:{{ previous_tag }}"
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "{{ host_port }}:{{ container_port }}"
      when: previous_tag | length > 0 and previous_tag != image_tag

    - name: Health check after rollback
      ansible.builtin.uri:
        url: "http://localhost:{{ host_port }}{{ health_path }}"
        status_code: 200
      register: rb_health
      retries: 6
      delay: 5
      until: rb_health.status == 200
      when: previous_tag | length > 0 and previous_tag != image_tag

    - name: Report failed release
      ansible.builtin.fail:
        msg: "Release {{ image_tag }} failed its health check. Rolled back to {{ previous_tag | default('nothing') }}."